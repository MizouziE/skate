name: Feature request
description: Suggest something new
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is this related to a problem?
      placeholder: e.g. "I keep wanting to filter by difficulty..."
    validations:
      required: false

  - type: textarea
    id: feature
    attributes:
      label: Describe the feature
      placeholder: What would you like to see?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New trick / data
        - UI / design
        - Wheel mechanics
        - New feature
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Mockups, links, examples
    validations:
      required: false
