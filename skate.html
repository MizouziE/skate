<!doctype html>
<html>
	<head>
		<title>Wheel of Skate</title>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"

			name="description"

		<!-- Open Graph (WhatsApp, Facebook, iMessage, Slack…) -->
		<meta property="og:title" content="Wheel of Skate" />
		<meta
			property="og:description"
			content="Spin the wheel, land a grind. A trick randomiser for aggressive inline skating — 49 tricks, 21 variations, zero excuses."
		/>
		<meta property="og:type" content="website" />
		<meta
			property="og:url"
			content="https://www.mizouzie.dev/skate/skate.html"

		<meta
			property="og:image"
			content="https://www.mizouzie.dev/skate/src/wheel-of-skate.png"
		/>

		<!-- Twitter / X card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Wheel of Skate" />
		<meta
			name="twitter:description"
			content="Spin the wheel, land a grind. A trick randomiser for aggressive inline skating — 49 tricks, 21 variations, zero excuses."
		/>
		<meta
			name="twitter:image"
			content="https://www.mizouzie.dev/skate/src/wheel-of-skate.png"
		/>
		<script defer src="skate.js" type="module"></script>
		<link rel="stylesheet" href="src/skate.css" />
	</head>

	<body>
		<header>
			<h1>Wheel of Skate</h1>
		</header>
		<div id="result">
			<span id="result-text"></span>
			<button id="result-skip">Skip</button>
		</div>
		<div id="wheelOfFortune">
			<canvas id="wheel"></canvas>
			<div id="spin">SPIN</div>
		</div>
		<button id="reshuffle">Reshuffle</button>
		<div id="history"></div>
	</body>
